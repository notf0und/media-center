homeassistant:

# Loads default set of integrations. Do not remove.
default_config:
# additional_ca:
#   #dockermon.test: dockermon.test.crt
#   open-webui.test: root-ca.crt

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes


alexa: !include alexa.yaml
automation: !include automations.yaml
#binary_sensor: !include binary_sensor.yaml
command_line: !include command_line.yaml
device_tracker: !include device_tracker.yaml
http: !include http.yaml
input_boolean: !include input_boolean.yaml
input_number: !include input_number.yaml
intent_script: !include intent_script.yaml
# light: !include light.yaml
logger: !include logger.yaml
notify: !include notify.yaml
rest_command: !include rest_command.yaml
scene: !include scenes.yaml
scrape: !include scrape.yaml
script: !include scripts.yaml
sensor: !include sensor.yaml
shell_command: !include shell_command.yaml
# switch: !include switch.yaml
template: !include_dir_merge_list configurations/template/
# telegram_bot: !include telegram_bot.yaml

smartir:
climate: !include climate.yaml

api:

mqtt:
  sensor:
    - name: Screen Lock
      state_topic: "station/binary_sensor/screen_lock/state"
      json_attributes_topic: "station/binary_sensor/screen_lock"
      unique_id: "station_screen_lock"
      device:
        name: station
        identifiers:
          - station

    # VoiceBM current speaker — published by voicebm_wyoming_proxy after each utterance.
    # Value is JSON: {"speaker_id": "gonzalo", "display_name": "Gonzalo", "confidence": 0.87}
    # Intent scripts use this to answer personalized questions like "where is my phone".
    - name: VoiceBM Current Speaker
      unique_id: voicebm_current_speaker
      state_topic: "voicebm/living/current_speaker"
      value_template: "{{ value_json.display_name }}"
      json_attributes_topic: "voicebm/living/current_speaker"
      json_attributes_template: "{{ value_json | tojson }}"
      device:
        name: VoiceBM
        identifiers:
          - voicebm
        manufacturer: VoiceBM
        model: Speaker Biometrics

    # VoiceBM last transcript — full JSON with speaker + text
    - name: VoiceBM Last Transcript
      unique_id: voicebm_last_transcript
      state_topic: "voicebm/transcript/full"
      value_template: "{{ value_json.text }}"
      json_attributes_topic: "voicebm/transcript/full"
      json_attributes_template: "{{ value_json | tojson }}"
      device:
        name: VoiceBM
        identifiers:
          - voicebm
