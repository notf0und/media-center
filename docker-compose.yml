---
version: '3'

services:

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/bazarr:/config
      - ./downloads:/data/downloads
      - /home/gonzalo/code/traefik/generate_certificates/root-certificates/root-ca.crt:/usr/local/share/ca-certificates/root-ca.crt:ro
    networks:
      - app-bridge
    labels:
      traefik.enable: true
      traefik.http.routers.bazarr.rule: Host("bazarr") || Host("bazarr.test")
      traefik.http.routers.bazarr.entrypoints: web
      traefik.http.routers.bazarr.service: bazarr
      traefik.http.routers.bazarr.middlewares: bazarr
      traefik.http.services.bazarr.loadbalancer.server.port: 6767
      traefik.http.middlewares.bazarr.redirectScheme.scheme: https

      traefik.http.routers.bazarr-https.rule: Host("bazarr") || Host("bazarr.test")
      traefik.http.routers.bazarr-https.entrypoints: websecure
      traefik.http.routers.bazarr-https.tls: true
      traefik.http.routers.bazarr-https.middlewares: authentik-outpost@docker

    restart: unless-stopped

  # calibre:
