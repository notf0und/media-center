  plex:
    image: linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/plex:/config
      - ./config/WebTools.bundle:/config/Library/Application Support/Plex Media Server/Plug-ins/WebTools.bundle
      - ./downloads:/data/downloads
      - ./tmp:/transcode
    labels:
      traefik.enable: true
      traefik.http.routers.plex.rule: Host("plex") || Host("plex.test")
      traefik.http.routers.plex.entrypoints: web
      traefik.http.routers.plex.service: plex
      traefik.http.services.plex.loadbalancer.server.port: 32400
      traefik.http.routers.plex.middlewares: plex
      traefik.http.middlewares.plex.redirectScheme.scheme: https
      traefik.http.routers.plex-https.rule: Host("plex") || Host("plex.test")
      traefik.http.routers.plex-https.entrypoints: websecure
      traefik.http.routers.plex-https.tls: true
    restart: unless-stopped


