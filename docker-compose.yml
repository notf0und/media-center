  #     traefik.enable: true
  #     traefik.http.routers.calibre.rule: Host("calibre") || Host("calibre.test")
  #     traefik.http.routers.calibre.entrypoints: web
  #     traefik.http.routers.calibre.service: calibre
  #     traefik.http.routers.calibre.middlewares: calibre
  #     traefik.http.services.calibre.loadbalancer.server.port: 8080
  #     traefik.http.middlewares.calibre.redirectScheme.scheme: https

