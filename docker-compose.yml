      - ./config/mqtt/log:/mosquitto/log
    labels:
      traefik.enable: true
      traefik.http.routers.mqtt.rule: Host("mqtt") || Host("mqtt.test")
      traefik.http.routers.mqtt.service: mqtt
      traefik.http.routers.mqtt.entrypoints: web
      traefik.http.services.mqtt.loadbalancer.server.port: 1883

      traefik.http.routers.mqtt.middlewares: mqtt
      traefik.http.middlewares.mqtt.redirectScheme.scheme: https
      traefik.http.routers.mqtt-https.rule: Host("mqtt") || Host("mqtt.test")
      traefik.http.routers.mqtt-https.entrypoints: websecure
      traefik.http.routers.mqtt-https.tls: true

      traefik.http.routers.mqtt-ws.rule: Host("mqtt-ws") || Host("mqtt-ws.test")
      traefik.http.routers.mqtt-ws.service: mqtt-ws
      traefik.http.routers.mqtt-ws.entrypoints: web
      traefik.http.services.mqtt-ws.loadbalancer.server.port: 9001

      traefik.http.routers.mqtt-ws.middlewares: mqtt-ws
      traefik.http.middlewares.mqtt-ws.redirectScheme.scheme: https
      traefik.http.routers.mqtt-ws-https.rule: Host("mqtt-ws") || Host("mqtt-ws.test")
      traefik.http.routers.mqtt-ws-https.entrypoints: websecure
      traefik.http.routers.mqtt-ws-https.tls: true
      restart: unless-stopped

  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant
    # Network mode must be set to host for MA to work correctly
    network_mode: host
    volumes:
      - ./config/music-assistant/data:/data/
      - ./scripts/music-assistant/music-assistant-entrypoint.sh:/mass-entrypoint.sh:ro
      - /home/gonzalo/code/traefik/generate_certificates/root-certificates/root-ca.crt:/usr/local/share/ca-certificates/root-ca.crt:ro
    # privileged caps (and security-opt) needed to mount smb folders within the container
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    environment:
      # Provide logging level as environment variable.
      # default=info, possible=(critical, error, warning, info, debug)
      - LOG_LEVEL=info
    entrypoint: ["/mass-entrypoint.sh"]
    labels:
      traefik.enable: true
      traefik.http.routers.music-assistant.rule: Host("music-assistant") || Host("music-assistant.test")
      traefik.http.routers.music-assistant.entrypoints: web
      traefik.http.routers.music-assistant.service: music-assistant
      traefik.http.services.music-assistant.loadbalancer.server.port: 8095

      # traefik.http.routers.music-assistant.middlewares: music-assistant
      # traefik.http.middlewares.music-assistant.redirectScheme.scheme: https
      traefik.http.routers.music-assistant-https.rule: Host("music-assistant") || Host("music-assistant.test")
      traefik.http.routers.music-assistant-https.entrypoints: websecure
      traefik.http.routers.music-assistant-https.service: music-assistant
      traefik.http.services.music-assistant-https.loadbalancer.server.port: 8095

      traefik.http.routers.music-assistant-https.tls: true
    restart: unless-stopped

