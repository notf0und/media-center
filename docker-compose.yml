    container_name: omnivoice-tts
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - OMNIVOICE_WYOMING_PORT=10211   # Wyoming protocol port for Home Assistant
      - OMNIVOICE_API_PORT=5055        # HTTP API port for the custom streaming integration
      - OMNIVOICE_DEVICE=cpu           # Use "cuda:0" if a GPU is available
      - OMNIVOICE_NUM_THREADS=6        # torch CPU threads (tune to available cores)
      - HF_TOKEN=${HF_TOKEN:-}         # Optional: set in .env for higher HF rate limits
      # Voice preset: auto | female_american | male_american | female_british | male_british | design
      - OMNIVOICE_DEFAULT_VOICE=female_american
      # Instruction used when DEFAULT_VOICE=design (or when API caller requests "design")
      - OMNIVOICE_VOICE_INSTRUCTION=female, american accent
      # Diffusion steps: 8=fastest, 16=fast+recommended, 32=higher quality
      - OMNIVOICE_NUM_STEPS=8
      - OMNIVOICE_SPEED=1.0
    volumes:
      - ./config/omnivoice-tts:/data   # scripts + model cache (HF_HOME=/data/models)
