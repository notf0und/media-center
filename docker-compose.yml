  parakeet-asr:
    build:
      context: ./Dockerfiles/wyoming-parakeet
      dockerfile: Dockerfile
    container_name: parakeet-asr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HF_HOME=/data
      - PARAKEET_WYOMING_PORT=10300  # Wyoming protocol port for Home Assistant
      - PARAKEET_API_PORT=5052       # OpenAI API port for OpenWebUI
    volumes:
      - ./config/parakeet-asr:/data
    network_mode: host
    entrypoint: ["/bin/bash", "/data/start_services.sh"]
    restart: unless-stopped

  voicebm:
    build:
      context: ./Dockerfiles/voicebm
      dockerfile: Dockerfile
    container_name: voicebm
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Speaker recognition model — single .onnx file downloaded on first start.
      # English models: nemo_en_titanet_small.onnx (38MB, default)
      #                 nemo_en_titanet_large.onnx (97MB, most accurate)
      #                 nemo_en_speakerverification_speakernet.onnx (22MB, smallest)
      #                 wespeaker_en_voxceleb_CAM++_LM.onnx (28MB)
      #                 wespeaker_en_voxceleb_resnet293_LM.onnx (109MB)
      #                 3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx (28MB)
      - SHERPA_MODEL_NAME=nemo_en_titanet_small.onnx
      # VoiceBM data directory (mounted from host — holds model, enrollments, etc.)
      - VOICEBM_BASE=/data
      # Wyoming proxy — HA connects here instead of parakeet:10300
      - VOICEBM_WYOMING_PORT=10301
      # Name shown in HA when adding this Wyoming STT service
      - VOICEBM_SERVICE_NAME=voicebm
      # Upstream Parakeet Wyoming address (supports hostname/IP for Traefik etc.)
      - UPSTREAM_WYOMING_URI=tcp://localhost:10300
      # Speaker injection: false = speaker only in MQTT sensor (recommended)
      #                    true  = prepend name to transcript ("Gonzalo: ...")
      - VOICEBM_INJECT_SPEAKER=false
      - VOICEBM_ANALYSIS_TIMEOUT=20
      # Dashboard port (enrollment UI)
      - VOICEBM_DASHBOARD_PORT=5055
      # MQTT broker (for speaker ID requests and HA sensor publishing)
      - MQTT_BROKER=localhost
      - MQTT_PORT=1883
      - MQTT_USER=mqtt
      - MQTT_PASS=we7VMNXYXpWgUfYWdNUdoW
    volumes:
      - ./config/voicebm:/data
    network_mode: host
    restart: unless-stopped

