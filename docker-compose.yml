  #   restart: unless-stopped

  esphome:
    image: esphome/esphome:latest
    container_name: esphome
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VIRTUAL_HOST=esphome.test

    volumes:
      - ./config/esphome/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    # devices: 
    #   - /dev/serial/by-id/usb-Hades2001_M5stack_4552A3E012-if00-port0:/dev/ttyUSB1
    labels:
      traefik.enable: true
      traefik.http.routers.esphome.rule: Host("esphome") || Host("esphome.test")
      traefik.http.routers.esphome.service: esphome
      traefik.http.routers.esphome.entrypoints: web
      traefik.http.services.esphome.loadbalancer.server.port: 6052

      traefik.http.routers.esphome.middlewares: esphome
      traefik.http.middlewares.esphome.redirectScheme.scheme: https

      traefik.http.routers.esphome-https.rule: Host("esphome") || Host("esphome.test")
      traefik.http.routers.esphome-https.entrypoints: websecure
      traefik.http.routers.esphome-https.tls: true

    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    privileged: true
    dns:
      - 192.168.10.5
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
    # extra_hosts:
      # - "host.docker.internal:host-gateway"
    # devices:
    #   - /dev/bus/usb/001/004:/dev/bus/usb/001/004
    volumes:
      - ./config/homeassistant:/config
      - ./config/ssh:/root/.ssh:rw
      - ./scripts/homeassistant/homeassistant-entrypoint.sh:/homeassistant-entrypoint.sh:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /home/gonzalo/code/traefik/generate_certificates/root-certificates/root-ca.crt:/usr/local/share/ca-certificates/root-ca.crt:ro

      # - /home/gonza/code/homeassistant/ha-contact-energy/custom_components/contact_energy:/config/custom_components/contact_energy
      # - /home/gonza/code/homeassistant/hacs_waste_collection_schedule/custom_components/waste_collection_schedule:/config/custom_components/waste_collection_schedule
      # - $HOME/.config/pulse/cookie:/root/.config/pulse/cookie
      # - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
      # - /var/run/docker.sock:/var/run/docker.sock  # Add this line
    entrypoint: ['/homeassistant-entrypoint.sh', '/init']
    labels:
      # Enable Traefik for this service
      traefik.enable: true

      # HTTP router configuration
      traefik.http.routers.homeassistant.rule: (Host("homeassistant") || Host("homeassistant.test")) && !HeaderRegexp("User-Agent", "Mailpit/v.*")
      traefik.http.routers.homeassistant.service: homeassistant
      traefik.http.routers.homeassistant.entrypoints: web
      traefik.http.routers.homeassistant.middlewares: homeassistant
      traefik.http.services.homeassistant.loadbalancer.server.port: 8123

      # HTTP to HTTPS redirect middleware
      traefik.http.middlewares.homeassistant.redirectScheme.scheme: https

      # Create a separate HTTP router for Mailpit
      traefik.http.routers.homeassistant-mailpit.rule: (Host("homeassistant") || Host("homeassistant.test")) && !HeaderRegexp("User-Agent", "Mailpit/v.*")
      traefik.http.routers.homeassistant-mailpit.service: homeassistant
      traefik.http.routers.homeassistant-mailpit.entrypoints: web

      # HTTPS router configuration
      traefik.http.routers.homeassistant-https.rule: Host("homeassistant") || Host("homeassistant.test")
      traefik.http.routers.homeassistant-https.entrypoints: websecure
      traefik.http.routers.homeassistant-https.tls: true
    group_add:
      - audio
    restart: unless-stopped

  kavita:
    image: linuxserver/kavita:latest
    container_name: kavita
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
