      # Offline (batch) ASR model for Wyoming/HA and HTTP API.
      # Models (change value and restart to switch):
      #   cohere-transcribe       ~2.6 GB  14 languages  RTF ~0.14  (default, best accuracy)
      #   nemo-parakeet-ctc-0.6b  ~300 MB  English       RTFx ~43   (fastest CPU)
      #   whisper-small           ~240 MB  99 languages  good multilingual
      #   sensevoice-small        ~250 MB  multi-lang    + emotion detection
      - SHERPA_MODEL=cohere-transcribe
      - SHERPA_LANGUAGE=en
      - SHERPA_WYOMING_PORT=10303
      - SHERPA_API_PORT=5054
      - SHERPA_NUM_THREADS=4
    volumes:
      - ./config/sherpa-onnx-asr:/data
    network_mode: host
    entrypoint: ["/bin/bash", "/data/start_services.sh"]
    restart: unless-stopped

  bonsai-llm:
    build:
      context: ./Dockerfiles/bonsai-llm
      dockerfile: Dockerfile
    container_name: bonsai-llm
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Bonsai 1.7B — 1-bit Q1_0_g128 quantized Qwen3 model (0.24 GB).
      # Built with ikawrakow/ik_llama.cpp which has AVX2-optimised Q1_0_G128 kernels
      # (PR #1570). Expect ~30-50 tok/s on a 6-core i5-8500 vs ~0.2 tok/s with old fork.
      # API: OpenAI-compat /v1/chat/completions with streaming at port 8085.
      - BONSAI_PORT=8085
      - BONSAI_THREADS=6
      # 8192 tokens needed for tool schemas (~1600 tokens) + system prompt + conversation
      - BONSAI_CTX_SIZE=8192
      - BONSAI_PARALLEL=2
      - BONSAI_MODEL_URL=https://huggingface.co/prism-ml/Bonsai-1.7B-gguf/resolve/main/Bonsai-1.7B.gguf
    volumes:
      - ./config/bonsai-llm:/data
    network_mode: host
    entrypoint: ["/bin/bash", "/data/run.sh"]
    restart: unless-stopped

  local-voice-pipeline:
    build:
      context: ./Dockerfiles/local-voice-pipeline
      dockerfile: Dockerfile
    container_name: local-voice-pipeline
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # WebSocket server — ESP32 connects here in realtime mode
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8765
      # Audio sample rates — must match ESPHome realtime package config:
      #   cores3-satellite-realtime.yaml mic=16kHz, speaker=24kHz
      - WEBSOCKET_INPUT_SAMPLE_RATE=16000    # mic sample rate (ESP32 → server)
      - WEBSOCKET_OUTPUT_SAMPLE_RATE=48000   # TTS output rate (server → ESP32 speaker)
      - TTS_SAMPLE_RATE=48000                # must match WEBSOCKET_OUTPUT_SAMPLE_RATE
      # STT — streaming online recognizer (processes audio chunks as they arrive)
      # Models: streaming-zipformer-en (~350 MB, default, k2 English transducer),
      #         streaming-zipformer-small-en (~65 MB, faster/lower accuracy),
      #         streaming-paraformer-zh-en (Chinese+English bilingual)
      #         parakeet-tdt-110m (~430 MB) - NeMo English, requires window_size metadata (experimental)
      - STT_PROVIDER=sherpa-onnx-online
      - STT_MODEL=streaming-zipformer-en
      - STT_MODEL_DIR=/data/stt-models
      - STT_LANGUAGE=en
      - STT_NUM_THREADS=4
      # LLM — switch backend by changing these three vars (no rebuild needed):
      #
      #   bonsai (ik_llama.cpp, ultra-fast 1.7B CPU model):
      #     LLM_PROVIDER=bonsai  LLM_BASE_URL=http://localhost:8085/v1  LLM_MODEL=Bonsai-1.7B
      #     LLM_TEMPERATURE=0.1  LLM_MAX_TOKENS=150  (keep low — small model)
      #     (leave SYSTEM_PROMPT_FILE empty to use the built-in concise voice prompt)
      #
      #   ollama (any model pulled with `ollama pull`):
      #     LLM_PROVIDER=ollama  LLM_BASE_URL=https://ollama.test/v1  LLM_MODEL=gpt-oss:120b-cloud
      #     LLM_TEMPERATURE=0.3  LLM_MAX_TOKENS=256
      #     SYSTEM_PROMPT_FILE=/data/prompts/jarvis.md  (Jarvis-style voice prompt)
      #
      #   openai / any OpenAI-compatible API:
      #     LLM_PROVIDER=openai-compat  LLM_BASE_URL=https://api.openai.com/v1  LLM_MODEL=gpt-4o-mini
      #     LLM_API_KEY=sk-...
      #
      - LLM_PROVIDER=ollama
      - LLM_BASE_URL=http://localhost:11434/v1
      - LLM_MODEL=gpt-oss:120b-cloud
      - LLM_API_KEY=not-needed
      - LLM_TEMPERATURE=0.3
      - LLM_MAX_TOKENS=256
      # System prompt: point to a .md file to use a file-based prompt (editable without rebuild).
      # Leave empty to fall back to LLM_SYSTEM_PROMPT env var, or the built-in default.
      - SYSTEM_PROMPT_FILE=/data/prompts/jarvis.md
      # LLM_SYSTEM_PROMPT=   # inline prompt (ignored when SYSTEM_PROMPT_FILE is set)
      # TTS — kokoro-http (existing service) or piper or openai-tts or elevenlabs
      - TTS_PROVIDER=kokoro-http
      - TTS_BASE_URL=http://localhost:5051/v1
      - TTS_VOICE=af_sky
      - TTS_MODEL=kokoro
      - TTS_API_KEY=not-needed
      # Home Assistant integration — MCP tools (preferred) or direct HA REST (fallback)
      # MCP_SERVER_URL: set to your ha-mcp server endpoint to enable all 88 HA tools.
      # MCP_TOOLS: comma-separated list of tools to expose (keep short for small models).
      # MCP_SSL_VERIFY: root CA is installed at boot, so trusted certs work with true.
      - MCP_SERVER_URL=https://ha-mcp.test/mcp
      - MCP_TOOLS=ha_search_entities,ha_get_state,ha_call_service,ha_bulk_control
      - MCP_SSL_VERIFY=true
      # HA_TOKEN is only used when MCP_SERVER_URL is empty (direct REST API fallback).
      - HA_URL=http://localhost:8123
      - HA_TOKEN=${HA_TOKEN:-}
      # SSL — root CA installed at boot so https://ollama.test and https://ha-mcp.test are trusted
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      # VAD tuning
      - VAD_CONFIDENCE=0.15
      - VAD_MIN_VOLUME=0.01
      - VAD_START_SECS=0
      - VAD_STOP_SECS=0.3
      - SESSION_TIMEOUT_SECS=30
    volumes:
      - ./config/local-voice-pipeline:/data
      - ./scripts/local-voice-pipeline/entrypoint.sh:/entrypoint.sh:ro
      - /home/gonzalo/code/traefik/generate_certificates/root-certificates/root-ca.crt:/usr/local/share/ca-certificates/root-ca.crt:ro
    network_mode: host
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["python", "-m", "app.main"]
    restart: unless-stopped

