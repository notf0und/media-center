  parakeet-asr:
    build:
      context: ./Dockerfiles/wyoming-parakeet
      dockerfile: Dockerfile
    container_name: parakeet-asr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HF_HOME=/data
      - PARAKEET_WYOMING_PORT=10300  # Wyoming protocol port for Home Assistant
      - PARAKEET_API_PORT=5052       # OpenAI API port for OpenWebUI
      # ASR model — change value and restart the container to switch models.
      # CPU RTFx benchmarks (higher = faster; source: onnx-asr benchmarks, Ryzen 7 9800X3D):
      #   nemo-parakeet-ctc-0.6b      RTFx ~43  fastest on CPU — recommended
      #   nemo-parakeet-tdt-0.6b-v3   RTFx ~35  previous default
      #   nemo-parakeet-rnnt-0.6b     RTFx ~33  slightly slower
      #   nemo-canary-1b-v2           RTFx  ~8  multilingual but much slower on CPU
      # Note: do NOT add --quantization int8 for CTC — benchmarks show it is slower than float32.
      - PARAKEET_MODEL=nemo-parakeet-ctc-0.6b
    volumes:
      - ./config/parakeet-asr:/data
    network_mode: host
    entrypoint: ["/bin/bash", "/data/start_services.sh"]
    restart: unless-stopped

  voicebm:
    build:
      context: ./Dockerfiles/voicebm
      dockerfile: Dockerfile
    container_name: voicebm
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VOICEBM_HOST=192.168.1.2
      # Speaker recognition model — single .onnx file downloaded on first start.
      # English models: nemo_en_titanet_small.onnx (38MB, default)
      #                 nemo_en_titanet_large.onnx (97MB, most accurate)
      #                 nemo_en_speakerverification_speakernet.onnx (22MB, smallest)
      #                 wespeaker_en_voxceleb_CAM++_LM.onnx (28MB)
      #                 wespeaker_en_voxceleb_resnet293_LM.onnx (109MB)
      #                 3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx (28MB)
      - SHERPA_MODEL_NAME=nemo_en_titanet_small.onnx
      # Wyoming proxy — HA connects here instead of parakeet:10300
      - VOICEBM_WYOMING_PORT=10301
      # ========== EMBEDDED STT CONFIGURATION ==========
      # VoiceBM includes STT (speech-to-text) internally using sherpa-onnx
      # To switch models: change VOICEBM_STT_MODEL, then run:
      #   docker-compose up -d --build voicebm
      # Models auto-download on first container start (cached in ./config/voicebm/stt-models/)
      #
      # Available STT models:
      #   cohere-transcribe (1.6 GB) — most accurate, multilingual, recommended
      #   nemo-parakeet-ctc-0.6b (71 MB) — fastest on CPU, English-only
      #   whisper-small (609 MB) — multilingual, good balance
      #   sensevoice-small (226 MB) — emotion & language detection
      - VOICEBM_STT_MODEL=cohere-transcribe
      - VOICEBM_STT_LANGUAGE=en
      - VOICEBM_STT_THREADS=4
      - VOICEBM_ANALYSIS_TIMEOUT=20
      # Enable/disable VoiceBM completely (true=enabled, false=STT-only mode)
      - VOICEBM_ENABLED=true
      # MQTT broker (for speaker ID requests and HA sensor publishing)
      - MQTT_BROKER=localhost
      - MQTT_PORT=1883
      - MQTT_USER=mqtt
      - MQTT_PASS=we7VMNXYXpWgUfYWdNUdoW
    volumes:
      - ./config/voicebm:/data
    network_mode: host
    restart: unless-stopped

