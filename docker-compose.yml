    volumes:
      - ./config/kokoro:/data
    network_mode: host
    entrypoint: ["/bin/bash", "/data/start_services.sh"]
    restart: unless-stopped

  supertonic-tts:
    build:
      context: ./Dockerfiles/supertonic-tts
      dockerfile: Dockerfile
    container_name: supertonic-tts
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SUPERTONIC_STEPS=30        # Denoising steps (1-10, lower=faster but lower quality)
      - SUPERTONIC_SPEED=1.30      # Speech speed multiplier (0.5-2.0)
      - OPENAI_API_PORT=5050       # OpenAI API port for OpenWebUI
    volumes:
      - ./config/supertonic:/config
      - ./config/supertonic:/data
    network_mode: host
    entrypoint: ["/bin/bash", "/config/start_services.sh"]
    restart: unless-stopped

  streamlink:
    build:
      context: ./Dockerfiles/streamlink # The directory containing the Dockerfile
      dockerfile: ./Dockerfile # Path to the Dockerfile (relative to the context)
    # image: streamlink-latest:latest # Tag for the built image
    container_name: streamlink
    network_mode: host
    # networks:
    #   - app-bridge
    # ports:
    #   - 46200-46250:46200-46250
    volumes:
      - ./streams.yaml:/config/streams.yaml # Mount the streams.yaml file
    restart: unless-stopped

  dockermon:
    image: philhawthorne/ha-dockermon
    container_name: dockermon
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/dockermon:/data
    networks:
      - app-bridge
    labels:
      traefik.enable: true
      traefik.http.routers.dockermon.rule: Host("dockermon") || Host("dockermon.test")
      traefik.http.routers.dockermon.service: dockermon
      traefik.http.routers.dockermon.entrypoints: web
      traefik.http.services.dockermon.loadbalancer.server.port: 8126

      traefik.http.routers.dockermon.middlewares: dockermon
      traefik.http.middlewares.dockermon.redirectScheme.scheme: https
      traefik.http.routers.dockermon-https.rule: Host("dockermon") || Host("dockermon.test")
      traefik.http.routers.dockermon-https.entrypoints: websecure
      traefik.http.routers.dockermon-https.tls: true

    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - GLANCES_OPT=-C /glances/conf/glances.conf -w
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro"
      - "./config/glances/glances.conf:/glances/conf/glances.conf"
    pid: "host"
    privileged: true
    labels:
      traefik.enable: true
      traefik.http.routers.glances.rule: Host("glances") || Host("glances.test")
      traefik.http.routers.glances.service: glances
      traefik.http.routers.glances.entrypoints: web
      traefik.http.services.glances.loadbalancer.server.port: 61208

      traefik.http.routers.glances.middlewares: glances
      traefik.http.middlewares.glances.redirectScheme.scheme: https
      traefik.http.routers.glances-https.rule: Host("glances") || Host("glances.test")
      traefik.http.routers.glances-https.entrypoints: websecure
      traefik.http.routers.glances-https.tls: true

    restart: unless-stopped


