      traefik.http.routers.ollama-https.entrypoints: websecure
      traefik.http.routers.ollama-https.tls: true
    restart: unless-stopped

  llama-cpp:
    # CPU-only is faster than Intel UHD 630 for this workload
    # To enable Vulkan/GPU: change image to :server-vulkan and add --n-gpu-layers 33
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-cpp
    command: >
      --model /models/model.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 2048
      --threads 4
      --parallel 1
      --cont-batching
      --timeout 600
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    # Uncomment for Vulkan support (slower on Intel UHD 630)
    # devices:
