      - PGID=${PGID}
      - TZ=${TZ}
      - SUPERTONIC_STEPS=60        # Denoising steps (1-10, lower=faster but lower quality)
      - SUPERTONIC_SPEED=1.30      # Speech speed multiplier (0.5-2.0)
